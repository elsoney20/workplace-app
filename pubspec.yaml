name: workplace_app
description: Internal company social workplace app (feed, groups, chat).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.4
  supabase_flutter: ^2.9.0
  shared_preferences: ^2.5.0
  http: ^1.2.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  qr_flutter: ^4.1.0
  file_picker: ^13.4.0
  image: ^4.13.1
  url_launcher: ^6.3.3
  mime: ^2.1.0
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Brand assets (logo, etc.) live here. See lib/core/config/brand_config.dart.
  assets:
    - assets/brand/
