name: workplace_app
description: Internal company social workplace app (feed, groups, chat).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.4
  supabase_flutter: ^2.9.0
  shared_preferences: ^2.5.0
  http: ^1.2.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  qr_flutter: ^4.1.0
  file_picker: ^13.4.0
  image: ^4.13.1
  url_launcher: ^6.3.3
  mime: ^2.1.0
  local_notifier: ^0.1.6
  video_player: ^2.14.1
  video_player_win: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Brand assets (logo, etc.) live here. See lib/core/config/brand_config.dart.
  assets:
    - assets/brand/
    # Demo photos + video for the "Demo content" button in the admin panel.
    - assets/demo/

  # Games2Egypt brand fonts (SIL Open Font License, see assets/fonts/OFL-*.txt).
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
